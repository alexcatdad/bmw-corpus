name: Normalize captures

on:
  push:
    branches: [main]
    paths:
      - 'captures/**'
      - 'raw/sha256/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    uses: alexcatdad/bmw-knowledge/.github/workflows/normalize-corpus.yml@d06a036caade7155a81a546ae3976a36ed8c5a76
    with:
      processor_revision: d06a036caade7155a81a546ae3976a36ed8c5a76
      callback_url: ${{ vars.PROCESSING_CALLBACK_URL }}
    secrets:
      processing_callback_secret: ${{ secrets.PROCESSING_CALLBACK_SECRET }}
